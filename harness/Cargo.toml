[package]
name = "nixxa-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
crossterm = { workspace = true }
futures = { workspace = true }
nixxa-accounts = { workspace = true }
nixxa-brain = { workspace = true }
nixxa-contracts = { workspace = true }
nixxa-controller = { workspace = true }
nixxa-db = { workspace = true }
nixxa-knowledge = { workspace = true }
nixxa-sandbox = { workspace = true }
ratatui = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
# The terminal pane's emulator: the shell's output becomes a grid of cells (D-066).
vt100 = "0.15"
zeroize = { workspace = true }

[dev-dependencies]
nixxa-contracts = { workspace = true, features = ["conformance"] }
nixxa-brain = { workspace = true, features = ["replay"] }
serde_json = { workspace = true }

[[bin]]
name = "nixxa"
path = "src/main.rs"
