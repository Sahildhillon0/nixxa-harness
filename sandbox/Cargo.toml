[package]
name = "nixxa-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "nixxa-sandboxd"
path = "src/bin/nixxa-sandboxd/main.rs"

[dependencies]
async-trait = { workspace = true }
nixxa-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "process", "rt", "sync", "time"] }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
nixxa-contracts = { workspace = true, features = ["conformance"] }
tokio = { workspace = true }
