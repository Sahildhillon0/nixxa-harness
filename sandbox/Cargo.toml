[package]
name = "nixxa-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "nixxa-sandboxd"
path = "src/bin/nixxa-sandboxd/main.rs"

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
nixxa-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "net", "process", "rt", "sync", "time"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The user's terminal in This directory: a PTY and the user's shell on it (the crate does the
# session and controlling-terminal setup, so there is no unsafe here).
portable-pty = "0.9"
# Linux: the daemon (Landlock prep, rlimits, subreapers, process trees, the terminal's PTY).
# Every Unix: killing a host background job's or terminal's process group.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process", "pty", "stdio", "termios", "thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"

[dev-dependencies]
nixxa-contracts = { workspace = true, features = ["conformance"] }
tokio = { workspace = true }
